# Deploy API ke Render (Blueprint). Di dashboard Render: New > Blueprint > pilih repositori ini.
services:
  - type: web
    name: qc-injection-molding-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
